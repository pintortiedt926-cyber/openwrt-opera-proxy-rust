name: Rust Port Test Build (OpenWrt 23.05 / 24.10 / 25.12 — ARM64 & MIPSEL, No Publish)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rust/**'
      - 'opera-proxy/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust fmt, clippy, unit & mock tests (ring + pure-rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path rust/opera-proxy/Cargo.toml --check

      - name: Run clippy (default ring-crypto)
        run: cargo clippy --manifest-path rust/opera-proxy/Cargo.toml --all-targets -- -D warnings

      - name: Run clippy (pure-rust-crypto for mipsel)
        run: cargo clippy --manifest-path rust/opera-proxy/Cargo.toml --no-default-features --features pure-rust-crypto --all-targets -- -D warnings

      - name: Run tests (default ring-crypto)
        run: cargo test --manifest-path rust/opera-proxy/Cargo.toml --all-targets

      - name: Run tests (pure-rust-crypto for mipsel)
        run: cargo test --manifest-path rust/opera-proxy/Cargo.toml --no-default-features --features pure-rust-crypto --all-targets

      - name: Run doc tests
        run: cargo test --manifest-path rust/opera-proxy/Cargo.toml --doc

  build-openwrt-ipk:
    name: Build OpenWrt ${{ matrix.openwrt_ver }} .ipk (${{ matrix.pkg_arch }})
    needs: rust-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt 23.05 (.ipk)
          - openwrt_ver: "23.05"
            pkg_arch: "aarch64_cortex-a53"
            target_name: "mediatek/filogic"
            rust_target: "aarch64-unknown-linux-musl"
            toolchain_prefix: "aarch64-openwrt-linux-musl"
            use_nightly_build_std: "false"
          - openwrt_ver: "23.05"
            pkg_arch: "mipsel_24kc"
            target_name: "ramips/mt7621"
            rust_target: "mipsel-unknown-linux-musl"
            toolchain_prefix: "mipsel-openwrt-linux-musl"
            use_nightly_build_std: "true"
          # OpenWrt 24.10 (.ipk)
          - openwrt_ver: "24.10"
            pkg_arch: "aarch64_cortex-a53"
            target_name: "mediatek/filogic"
            rust_target: "aarch64-unknown-linux-musl"
            toolchain_prefix: "aarch64-openwrt-linux-musl"
            use_nightly_build_std: "false"
          - openwrt_ver: "24.10"
            pkg_arch: "mipsel_24kc"
            target_name: "ramips/mt7621"
            rust_target: "mipsel-unknown-linux-musl"
            toolchain_prefix: "mipsel-openwrt-linux-musl"
            use_nightly_build_std: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses5-dev zstd xz-utils file binutils

      - name: Set up Rust (stable for aarch64)
        if: matrix.use_nightly_build_std == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Set up Rust (nightly + rust-src for Tier 3 mipsel_24kc)
        if: matrix.use_nightly_build_std == 'true'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Resolve OpenWrt ${{ matrix.openwrt_ver }} SDK (${{ matrix.target_name }})
        id: sdk
        run: |
          BRANCH="${{ matrix.openwrt_ver }}"
          FULL_VER=$(curl -fsSL "https://downloads.openwrt.org/releases/" \
            | grep -oE "${BRANCH//./\\.}\.[0-9]+" | sort -V | uniq | tail -1)
          BASE_URL="https://downloads.openwrt.org/releases/$FULL_VER/targets/${{ matrix.target_name }}"
          SDK_FILENAME=$(curl -fsSL "$BASE_URL/" \
            | grep -o 'href="[^"]*openwrt-sdk-[^"]*\.tar\.\(zst\|xz\)"' \
            | sed 's/href="//;s/"$//' | head -1)
          echo "sdk_url=$BASE_URL/$SDK_FILENAME" >> "$GITHUB_OUTPUT"
          echo "sdk_filename=$SDK_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Extract OpenWrt SDK
        run: |
          wget -qO sdk.archive "${{ steps.sdk.outputs.sdk_url }}"
          mkdir -p sdk
          if [[ "${{ steps.sdk.outputs.sdk_filename }}" == *.tar.zst ]]; then
            tar --use-compress-program=unzstd -xf sdk.archive -C sdk --strip-components=1
          else
            tar -xJf sdk.archive -C sdk --strip-components=1
          fi

      - name: Cross-compile Rust opera-proxy (${{ matrix.rust_target }})
        run: |
          TC_BIN=$(find "$PWD/sdk/staging_dir" -maxdepth 3 -type d -name bin | grep 'toolchain-' | head -1)
          export PATH="$TC_BIN:$PATH"
          export STAGING_DIR="$PWD/sdk/staging_dir"
          PREFIX="${{ matrix.toolchain_prefix }}"
          if [ "${{ matrix.use_nightly_build_std }}" = "false" ]; then
            export CC_aarch64_unknown_linux_musl="${PREFIX}-gcc"
            export AR_aarch64_unknown_linux_musl="${PREFIX}-ar"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="${PREFIX}-gcc"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-C target-feature=+crt-static"
            cargo build --manifest-path rust/opera-proxy/Cargo.toml --release --locked --target aarch64-unknown-linux-musl
          else
            export CC_mipsel_unknown_linux_musl="${PREFIX}-gcc"
            export AR_mipsel_unknown_linux_musl="${PREFIX}-ar"
            export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER="${PREFIX}-gcc"
            export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-C target-feature=+soft-float,+crt-static -C link-self-contained=no -C link-arg=-static"
            cargo +nightly build --manifest-path rust/opera-proxy/Cargo.toml --release --locked \
              --no-default-features --features pure-rust-crypto \
              -Z build-std=core,alloc,std,panic_abort \
              --target mipsel-unknown-linux-musl
          fi

      - name: Validate ELF binary (no glibc)
        run: |
          BIN="rust/opera-proxy/target/${{ matrix.rust_target }}/release/opera-proxy"
          file "$BIN"
          readelf -h "$BIN"
          if readelf -d "$BIN" 2>/dev/null | grep -qiE 'glibc|libc\.so\.6'; then
            echo "ERROR: binary unexpectedly depends on glibc"
            exit 1
          fi
          ls -lh "$BIN"

      - name: Package OpenWrt ${{ matrix.openwrt_ver }} .ipk
        run: |
          BIN="$PWD/rust/opera-proxy/target/${{ matrix.rust_target }}/release/opera-proxy"
          cp -r opera-proxy sdk/package/
          cp -r luci-app-opera-proxy sdk/package/
          cd sdk
          make oldconfig || make defconfig
          ./scripts/feeds update base luci
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_opera-proxy=y" >> .config
          make defconfig
          make package/opera-proxy/compile OPERA_PROXY_BIN="$BIN" V=s -j"$(nproc)"
          mkdir -p ../output-artifacts
          find bin/ -name "opera-proxy_*.ipk" -exec cp {} ../output-artifacts/ \;
          ls -lh ../output-artifacts/

      - name: Upload test artifact (no release)
        uses: actions/upload-artifact@v4
        with:
          name: opera-proxy-rust-${{ matrix.pkg_arch }}-openwrt-${{ matrix.openwrt_ver }}-ipk
          path: output-artifacts/
          if-no-files-found: error

  build-openwrt-25-12-apk:
    name: Build OpenWrt 25.12 .apk (${{ matrix.pkg_arch }}, strictly after 23.05/24.10)
    needs: [rust-checks, build-openwrt-ipk]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg_arch: "aarch64_cortex-a53"
            target_name: "mediatek/filogic"
            rust_target: "aarch64-unknown-linux-musl"
            toolchain_prefix: "aarch64-openwrt-linux-musl"
            use_nightly_build_std: "false"
          - pkg_arch: "mipsel_24kc"
            target_name: "ramips/mt7621"
            rust_target: "mipsel-unknown-linux-musl"
            toolchain_prefix: "mipsel-openwrt-linux-musl"
            use_nightly_build_std: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses5-dev zstd xz-utils file binutils

      - name: Set up Rust (stable for aarch64)
        if: matrix.use_nightly_build_std == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Set up Rust (nightly + rust-src for Tier 3 mipsel_24kc)
        if: matrix.use_nightly_build_std == 'true'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Resolve OpenWrt 25.12 SDK (${{ matrix.target_name }})
        id: sdk
        run: |
          FULL_VER=$(curl -fsSL "https://downloads.openwrt.org/releases/" \
            | grep -oE '25\.12\.[0-9]+' | sort -V | uniq | tail -1)
          BASE_URL="https://downloads.openwrt.org/releases/$FULL_VER/targets/${{ matrix.target_name }}"
          SDK_FILENAME=$(curl -fsSL "$BASE_URL/" \
            | grep -o 'href="[^"]*openwrt-sdk-[^"]*\.tar\.\(zst\|xz\)"' \
            | sed 's/href="//;s/"$//' | head -1)
          echo "sdk_url=$BASE_URL/$SDK_FILENAME" >> "$GITHUB_OUTPUT"
          echo "sdk_filename=$SDK_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Extract OpenWrt 25.12 SDK
        run: |
          wget -qO sdk.archive "${{ steps.sdk.outputs.sdk_url }}"
          mkdir -p sdk
          if [[ "${{ steps.sdk.outputs.sdk_filename }}" == *.tar.zst ]]; then
            tar --use-compress-program=unzstd -xf sdk.archive -C sdk --strip-components=1
          else
            tar -xJf sdk.archive -C sdk --strip-components=1
          fi

      - name: Cross-compile Rust opera-proxy (${{ matrix.rust_target }})
        run: |
          TC_BIN=$(find "$PWD/sdk/staging_dir" -maxdepth 3 -type d -name bin | grep 'toolchain-' | head -1)
          export PATH="$TC_BIN:$PATH"
          export STAGING_DIR="$PWD/sdk/staging_dir"
          PREFIX="${{ matrix.toolchain_prefix }}"
          if [ "${{ matrix.use_nightly_build_std }}" = "false" ]; then
            export CC_aarch64_unknown_linux_musl="${PREFIX}-gcc"
            export AR_aarch64_unknown_linux_musl="${PREFIX}-ar"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="${PREFIX}-gcc"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-C target-feature=+crt-static"
            cargo build --manifest-path rust/opera-proxy/Cargo.toml --release --locked --target aarch64-unknown-linux-musl
          else
            export CC_mipsel_unknown_linux_musl="${PREFIX}-gcc"
            export AR_mipsel_unknown_linux_musl="${PREFIX}-ar"
            export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER="${PREFIX}-gcc"
            export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-C target-feature=+soft-float,+crt-static -C link-self-contained=no -C link-arg=-static"
            cargo +nightly build --manifest-path rust/opera-proxy/Cargo.toml --release --locked \
              --no-default-features --features pure-rust-crypto \
              -Z build-std=core,alloc,std,panic_abort \
              --target mipsel-unknown-linux-musl
          fi

      - name: Package OpenWrt 25.12 .apk
        run: |
          BIN="$PWD/rust/opera-proxy/target/${{ matrix.rust_target }}/release/opera-proxy"
          cp -r opera-proxy sdk/package/
          cp -r luci-app-opera-proxy sdk/package/
          cd sdk
          make oldconfig || make defconfig
          ./scripts/feeds update base luci
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_opera-proxy=y" >> .config
          make defconfig
          make package/opera-proxy/compile OPERA_PROXY_BIN="$BIN" V=s -j"$(nproc)"
          mkdir -p ../output-artifacts
          find bin/ -name "opera-proxy-*.apk" -exec cp {} ../output-artifacts/ \;
          ls -lh ../output-artifacts/

      - name: Upload 25.12 .apk test artifact (no release)
        uses: actions/upload-artifact@v4
        with:
          name: opera-proxy-rust-${{ matrix.pkg_arch }}-openwrt-25.12-apk
          path: output-artifacts/
          if-no-files-found: error
