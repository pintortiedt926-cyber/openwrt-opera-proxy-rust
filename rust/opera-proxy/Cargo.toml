[package]
name = "opera-proxy"
version = "1.32.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Safe Rust port of Opera Proxy client for OpenWrt ARM64"

[features]
default = ["ring-crypto"]
ring-crypto = ["rustls/ring", "tokio-rustls/ring"]
pure-rust-crypto = ["dep:rustls-rustcrypto"]

[dependencies]
base64 = "0.22"
bytes = "1"
csv = "1.3"
getrandom = "0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto"] }
md-5 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rustls-rustcrypto = { version = "0.1.0-pre.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
url = "2"
webpki-roots = "1.0"

[dev-dependencies]
rcgen = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
